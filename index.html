<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LuminaScan — QR Code Scanner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--a:#6555f4;--b:#955cff;--c:#d66dff}
body{min-height:100vh;background:linear-gradient(135deg,#6555f4,#955cff 55%,#d66dff);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,100%);background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(18px);border-radius:24px;padding:24px;box-shadow:0 20px 60px rgba(30,20,100,.25)}
h1{font-size:30px;text-align:center}.sub{text-align:center;opacity:.88;margin-top:6px;font-size:13px}
.divider{width:58px;height:3px;margin:20px auto;background:#fff;border-radius:5px}
.btn{border:0;border-radius:13px;padding:12px 18px;font-weight:800;font-size:13px;cursor:pointer}
.primary{background:#fff;color:#6555f4}.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25)}
.home-actions{display:flex;justify-content:center;margin-top:18px}
.scanner,.result{display:none;text-align:center}.instruction{font-weight:800;font-size:15px;margin-bottom:14px}
.viewport{position:relative;height:320px;border-radius:17px;overflow:hidden;background:#111;margin:14px 0}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:15%;border:3px solid rgba(255,255,255,.88);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
.line{position:absolute;left:12%;right:12%;top:12%;height:3px;border-radius:3px;background:#fff;animation:scan 1.8s linear infinite;box-shadow:0 0 12px #fff}
@keyframes scan{0%{top:12%}100%{top:88%}}
.controls{display:flex;gap:8px;justify-content:space-between}
.result-content{margin:15px 0;background:rgba(255,255,255,.16);padding:15px;border-radius:14px;word-break:break-all;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.footer{text-align:center;margin-top:15px;font-size:10px;opacity:.7}
#canvas{display:none}
</style>
</head>
<body>
<div class="card">
<section id="home">
<h1>LuminaScan</h1>
<p class="sub">Fast QR Code Scanner</p><div class="divider"></div>
<div class="home-actions"><button class="btn primary" id="start">Start Scanning</button></div>
</section>

<section id="scanner" class="scanner">
<p class="instruction">Point your camera at a QR code</p>
<div class="viewport">
<video id="video" playsinline></video><div class="frame"></div><div class="line"></div>
</div>
<div class="controls">
<button class="btn ghost" id="switch">↻ Switch Camera</button>
<button class="btn ghost" id="cancel">Cancel</button>
</div>
</section>

<section id="result" class="result">
<h2>Scan Result</h2>
<div id="output" class="result-content"></div>
<div class="actions">
<button class="btn primary" id="copy">Copy</button>
<button class="btn" id="visit" style="background:#22c55e;color:#fff">Visit Link</button>
<button class="btn ghost" id="again">Scan Again</button>
</div>
</section>
<p class="footer">LuminaScan Pro</p>
<canvas id="canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const home=document.getElementById('home'),scanner=document.getElementById('scanner'),result=document.getElementById('result');
const start=document.getElementById('start'),cancel=document.getElementById('cancel'),again=document.getElementById('again');
const sw=document.getElementById('switch'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),output=document.getElementById('output'),copy=document.getElementById('copy'),visit=document.getElementById('visit');
let stream=null,running=false,front=false,lastResult='';

function validUrl(value){try{new URL(value);return true}catch{return false}}
function stopCamera(){
 running=false;
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
}
function showHome(){stopCamera();scanner.style.display='none';result.style.display='none';home.style.display='block'}
async function startScan(){
 home.style.display='none';result.style.display='none';scanner.style.display='block';
 stopCamera();
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:front?'user':'environment',width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;await video.play();running=true;requestAnimationFrame(scan);
 }catch(e){alert('Camera access was denied or is unavailable. Please allow camera permission.');showHome()}
}
function showResult(value){
 stopCamera();lastResult=value;output.textContent=value;visit.style.display=validUrl(value)?'inline-block':'none';scanner.style.display='none';result.style.display='block';
}
function scan(){
 if(!running)return;
 if(video.readyState>=2){
  const w=video.videoWidth,h=video.videoHeight;
  if(w&&h){
   canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext('2d',{willReadFrequently:true});
   ctx.drawImage(video,0,0,w,h);
   const data=ctx.getImageData(0,0,w,h);
   const code=jsQR(data.data,data.width,data.height,{inversionAttempts:'attemptBoth'});
   if(code){showResult(code.data);return}
  }
 }
 requestAnimationFrame(scan);
}
start.onclick=startScan;again.onclick=startScan;cancel.onclick=showHome;
sw.onclick=()=>{front=!front;startScan()};
copy.onclick=async()=>{try{await navigator.clipboard.writeText(lastResult);copy.textContent='Copied!';setTimeout(()=>copy.textContent='Copy',1600)}catch{alert('Could not copy the result.')}};
visit.onclick=()=>{if(validUrl(lastResult))window.location.href=lastResult};
</script>
</body>
</html>
